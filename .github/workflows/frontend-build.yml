name: Frontend Build

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Pin stable npm version
        run: npm install -g npm@10.8.2

      - name: Show pinned npm version
        run: npm --version

      - name: Verify frontend lockfile
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --no-audit --no-fund --prefer-offline
        timeout-minutes: 12

      - name: Verify frontend dependencies
        run: |
          npm ls vite --depth=0
          test -x ./node_modules/.bin/vite
          npx vite --version

      - name: Build frontend
        run: npm run build
        timeout-minutes: 5