<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="wall" x1="960" y1="0" x2="960" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18212A"/>
      <stop offset="0.58" stop-color="#202A31"/>
      <stop offset="1" stop-color="#273138"/>
    </linearGradient>
    <linearGradient id="floor" x1="960" y1="710" x2="960" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242B2D"/>
      <stop offset="1" stop-color="#14191B"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="0" cy="0" r="1" gradientTransform="translate(1490 260) rotate(130) scale(720 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEC995" stop-opacity=".34"/>
      <stop offset=".42" stop-color="#B5C7C5" stop-opacity=".10"/>
      <stop offset="1" stop-color="#6E8B89" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C7B83"/>
      <stop offset=".48" stop-color="#40535A"/>
      <stop offset="1" stop-color="#1E2B31"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="430" y1="470" x2="430" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC986" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFC986" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur40" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur20" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- room shell -->
  <rect width="1920" height="780" fill="url(#wall)"/>
  <rect y="780" width="1920" height="300" fill="url(#floor)"/>
  <rect width="1920" height="1080" fill="url(#windowGlow)"/>

  <!-- quiet architectural lines -->
  <path d="M0 780H1920" stroke="#9FB0B1" stroke-opacity=".12" stroke-width="2"/>
  <path d="M960 780V1080" stroke="#C9D2D0" stroke-opacity=".035"/>
  <path d="M290 780L210 1080M1630 780L1710 1080" stroke="#D4D8D3" stroke-opacity=".035"/>

  <!-- window / future light -->
  <rect x="1325" y="118" width="370" height="430" rx="10" fill="#11191D" stroke="#8DA0A2" stroke-opacity=".24" stroke-width="3"/>
  <rect x="1345" y="138" width="330" height="390" rx="5" fill="url(#windowSky)"/>
  <path d="M1510 138V528M1345 337H1675" stroke="#D8E1DF" stroke-opacity=".14" stroke-width="3"/>
  <circle cx="1590" cy="218" r="34" fill="#F3D7AF" fill-opacity=".15"/>
  <path d="M1345 470C1450 430 1550 448 1675 390V528H1345V470Z" fill="#14242A" fill-opacity=".72"/>
  <path d="M1345 492C1458 452 1570 470 1675 420" stroke="#E5C79A" stroke-opacity=".12" stroke-width="2"/>

  <!-- work desk zone: minimal -->
  <rect x="230" y="642" width="455" height="26" rx="8" fill="#6D6154"/>
  <rect x="266" y="668" width="24" height="175" rx="8" fill="#4C4741"/>
  <rect x="622" y="668" width="24" height="175" rx="8" fill="#4C4741"/>
  <rect x="375" y="518" width="178" height="108" rx="9" fill="#171D21" stroke="#9EAAA8" stroke-opacity=".18" stroke-width="2"/>
  <rect x="390" y="534" width="148" height="78" rx="4" fill="#1C2529"/>
  <rect x="456" y="626" width="16" height="18" rx="4" fill="#4A4D4B"/>
  <path d="M430 646H498" stroke="#767774" stroke-width="8" stroke-linecap="round"/>

  <!-- warm practical, subdued -->
  <ellipse cx="330" cy="745" rx="145" ry="115" fill="url(#lampGlow)" filter="url(#blur20)"/>
  <path d="M331 548V635" stroke="#95806A" stroke-width="10" stroke-linecap="round"/>
  <path d="M286 548H376L350 500H312L286 548Z" fill="#D2A66F" fill-opacity=".65"/>
  <circle cx="331" cy="548" r="24" fill="#FFD39A" fill-opacity=".40"/>

  <!-- creative corner: almost empty shelf + frame slot -->
  <rect x="80" y="255" width="250" height="14" rx="7" fill="#776A5E" fill-opacity=".68"/>
  <rect x="108" y="164" width="94" height="64" rx="7" fill="#263036" stroke="#B0BDBB" stroke-opacity=".14"/>
  <rect x="225" y="184" width="72" height="44" rx="6" fill="#20292E" stroke="#B0BDBB" stroke-opacity=".12"/>

  <!-- fitness corner: subtle mat -->
  <path d="M1050 860L1285 835L1390 912L1134 946L1050 860Z" fill="#415050" fill-opacity=".42" stroke="#9EAAA8" stroke-opacity=".09"/>
  <circle cx="1295" cy="811" r="17" fill="#596867" fill-opacity=".55"/>

  <!-- learning corner -->
  <rect x="844" y="338" width="230" height="300" rx="12" fill="#20282C" stroke="#AAB5B3" stroke-opacity=".10" stroke-width="2"/>
  <rect x="867" y="385" width="184" height="10" rx="5" fill="#78827F" fill-opacity=".34"/>
  <rect x="867" y="473" width="184" height="10" rx="5" fill="#78827F" fill-opacity=".28"/>
  <rect x="867" y="560" width="184" height="10" rx="5" fill="#78827F" fill-opacity=".22"/>
  <rect x="886" y="350" width="36" height="35" rx="4" fill="#80705F" fill-opacity=".58"/>
  <rect x="929" y="356" width="52" height="29" rx="4" fill="#647170" fill-opacity=".55"/>

  <!-- sleep/recovery zone -->
  <rect x="1450" y="684" width="345" height="120" rx="28" fill="#4B5151" fill-opacity=".62"/>
  <rect x="1490" y="652" width="130" height="58" rx="22" fill="#6A706D" fill-opacity=".52"/>
  <rect x="1435" y="804" width="380" height="22" rx="11" fill="#30383A"/>
  <ellipse cx="1625" cy="840" rx="265" ry="95" fill="#000" fill-opacity=".14" filter="url(#blur20)"/>

  <!-- subtle rug / calm UI-safe center -->
  <ellipse cx="935" cy="900" rx="360" ry="125" fill="#7C725F" fill-opacity=".14"/>
  <ellipse cx="935" cy="900" rx="285" ry="92" fill="#1B2224" fill-opacity=".12"/>

  <!-- Ringo: tiny central guide silhouette -->
  <g opacity=".55">
    <ellipse cx="924" cy="813" rx="35" ry="23" fill="#111719"/>
    <circle cx="956" cy="798" r="20" fill="#111719"/>
    <path d="M943 784L948 764L958 781M967 782L978 765L978 787" fill="#111719"/>
    <path d="M891 811C860 797 853 773 866 757" stroke="#111719" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- empty reward-slot ghosts: barely visible -->
  <g fill="none" stroke="#E9EEE9" stroke-opacity=".055" stroke-width="2" stroke-dasharray="8 12">
    <circle cx="760" cy="680" r="38"/>
    <rect x="1178" y="610" width="70" height="70" rx="18"/>
    <circle cx="1420" cy="615" r="30"/>
  </g>

  <!-- vignette to preserve UI contrast -->
  <rect width="1920" height="1080" fill="#071014" fill-opacity=".10"/>
  <rect width="1920" height="1080" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="70"/>
</svg>