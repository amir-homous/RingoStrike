<!DOCTYPE html>
<html lang="en">
<body>
    <h2>RingoStrike Dev Login</h2>
    <form id="loginForm">
        <input type="text" id="identifier" placeholder="User Identifier (e.g., amir)" required><br>
        <input type="text" id="display_name" placeholder="Display Name" required><br>
        <input type="password" id="secret" placeholder="Local Login Secret" required><br>
        <button type="submit">Login</button>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                identifier: document.getElementById('identifier').value,
                display_name: document.getElementById('display_name').value,
                secret: document.getElementById('secret').value
            };

            try {
                // طبق app.py، این endpoint با متد POST فراخوانی میشه
                const response = await fetch('/auth/local', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Login Successful! Redirecting...');
                    // بعد از لاگین معمولا به صفحه اصلی برمیگرده
                    window.location.href = '/'; 
                } else {
                    alert('Login Failed: ' + await response.text());
                }
            } catch (err) {
                console.error(err);
                alert('Server Error');
            }
        });
    </script>
</body>
</html>
